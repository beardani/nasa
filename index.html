<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA 오늘의 우주 사진</title>
  <style>
    :root {
      --bg-color: #0b0d17;
      --card-bg: #151932;
      --text-color: #e2e8f0;
      --accent-color: #38bdf8;
      --muted-color: #94a3b8;
      --border-color: #1e293b;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 25px;
    }

    .search-box {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    label {
      font-weight: 600;
    }

    input[type="date"] {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    button {
      padding: 10px 24px;
      background-color: var(--accent-color);
      color: #0b0d17;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .loading {
      text-align: center;
      display: none;
      font-size: 1.1rem;
      margin: 30px 0;
      color: var(--accent-color);
    }

    .apod-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      display: none;
    }

    .media-container {
      width: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }

    .media-container img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 750px;
      object-fit: contain;
    }

    .media-container iframe {
      width: 100%;
      height: 480px;
      border: none;
    }

    .content {
      padding: 25px;
    }

    .content h2 {
      margin-top: 0;
      color: #fff;
      font-size: 1.6rem;
    }

    .meta-info {
      font-size: 0.9rem;
      color: var(--muted-color);
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .explanation {
      line-height: 1.7;
      font-size: 1rem;
      color: #cbd5e1;
    }

    .original-link {
      display: inline-block;
      margin-top: 15px;
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
    }

    .original-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌌 NASA 오늘의 우주 사진 (APOD)</h1>
    
    <div class="search-box">
      <label for="searchDate">날짜 선택:</label>
      <input type="date" id="searchDate">
      <button onclick="fetchAPOD()">사진 불러오기</button>
    </div>

    <div id="loading" class="loading">NASA에서 우주 사진을 불러오는 중... 🚀</div>

    <div id="apodCard" class="apod-card">
      <div id="mediaContainer" class="media-container"></div>
      <div class="content">
        <h2 id="mediaTitle"></h2>
        <div class="meta-info">
          <span id="mediaDate"></span>
          <span id="mediaCredit"></span>
        </div>
        <p id="mediaExplanation" class="explanation"></p>
        <a id="permalink" class="original-link" target="_blank" rel="noopener noreferrer">🔗 NASA 원본 문서 보기</a>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = 'EW15LMdvyjtyeKr9VeTPrFgj2kEo2ut5Ab8A37yb';

    // 오늘 날짜 기본 세팅
    const today = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('searchDate');
    dateInput.value = today;
    dateInput.max = today;

    async function fetchAPOD() {
      const date = dateInput.value;
      if (!date) {
        alert('날짜를 선택해주세요.');
        return;
      }

      const loadingEl = document.getElementById('loading');
      const apodCard = document.getElementById('apodCard');
      const mediaContainer = document.getElementById('mediaContainer');

      loadingEl.style.display = 'block';
      apodCard.style.display = 'none';

      const url = `https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&date=${date}`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error('사진을 불러오지 못했습니다. API 키 또는 날짜를 확인해주세요.');
        }

        const data = await response.json();
        
        // 1. 텍스트 정보 매핑
        document.getElementById('mediaTitle').innerText = data.title || '제목 없음';
        document.getElementById('mediaDate').innerText = `📅 ${data.date}`;
        
        // 저작권 / 출처 정보 매핑 (credit, copyright, url 등 다각도로 체크)
        const creditText = data.credit || data.copyright || '';
        document.getElementById('mediaCredit').innerText = creditText ? `| 📷 ${creditText.replace(/^Image Credit:\s*/i, '')}` : '';
        
        document.getElementById('mediaExplanation').innerText = data.explanation || '';

        // 원본 문서 바로가기 링크
        const permalinkEl = document.getElementById('permalink');
        if (data.permalink) {
          permalinkEl.href = data.permalink;
          permalinkEl.style.display = 'inline-block';
        } else {
          permalinkEl.style.display = 'none';
        }

        // 2. 이미지/미디어 링크 매핑
        // 예시 구조처럼 hdurl이 우선 존재하면 hdurl 사용, 없으면 url 사용
        const imageUrl = data.hdurl || data.url;

        mediaContainer.innerHTML = '';
        if (data.media_type === 'image' || !data.media_type) {
          const img = document.createElement('img');
          img.src = imageUrl;
          img.alt = data.alt || data.title || 'NASA APOD Image';
          mediaContainer.appendChild(img);
        } else if (data.media_type === 'video') {
          const iframe = document.createElement('iframe');
          iframe.src = data.url;
          iframe.allowFullscreen = true;
          mediaContainer.appendChild(iframe);
        }

        apodCard.style.display = 'block';
      } catch (error) {
        alert(error.message);
      } finally {
        loadingEl.style.display = 'none';
      }
    }

    // 초기 실행 (2015-10-11 예시 데이터 테스트용 또는 오늘 날짜)
    fetchAPOD();
  </script>
</body>
</html>
